title: "Orfest Docs"
description: "Docs and guides for Orfest"
author: "skueee"
plugins:
  - package: "jsr:@steno/plugin-tailwind"
    mode: trusted
  - package: "jsr:@steno/plugin-search"
    mode: trusted
contentDir: "docs/content"
output: "dist/steno"
devPort: 5735
shortUrls: true
theme: jsr:@steno/theme-docs-minimal@^0.14.0
themeConfig:
  author: "skueee"
navigation:
  - title: "← Back to site"
    url: "/return" # /docs/return is automatically redirected to the homepage
  - title: "Start"
    children:
      - title: "Start here"
        url: "/start/start-here"
  - title: "Shipping and Rating"
    children:
      - title: "Shipping"
        url: "/shipping/shipping"
      - title: "Rating"
        url: "/rating/rating/"
        children:
          - title: "Constraints"
            url: "/rating/constraints"
          - title: "Titles"
            url: "/rating/titles"
  - title: "FAQ"
    url: "/faq"
